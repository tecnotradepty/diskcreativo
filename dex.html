<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Compilar Proyecto</title>
    <meta name="description" content="Compilador y auditoría interactiva de proyectos B2B de Disk Creativo. Diagnóstico operativo, definición de alcance y cotización directa.">
    <meta name="theme-color" content="#050505">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/brand/logo-nav.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Estilos Modulares -->
    <link rel="stylesheet" href="assets/css/main.css?v=13">
    <link rel="stylesheet" href="assets/css/terminal.css?v=13">
</head>
<body>

    <!-- Fondo espacial y estrellas compartidas -->
    <div class="ambient-canvas"></div>
    <div class="minimal-stars"></div>

    <!-- ─── 02. NAVBAR CLAYMORPHISM 3D & APPLE LIQUID GLASS ─── -->
    <nav class="top-navbar nav-claymorphic" id="topNavbar">
        <a href="index.html" class="navbar-brand">
            <img src="assets/images/brand/logo-nav.png" alt="Disk Icon" class="brand-icon">
            <span class="brand-name">DISK CREATIVO</span>
        </a>

        <div class="navbar-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="dex.html" class="nav-link active">Inicia tu Proyecto</a>
            <a href="https://wa.me/50768529324" target="_blank" rel="noopener noreferrer" class="nav-btn-clay">
                <span>Contacto</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
        </div>
    </nav>

    <!-- Ventana OS Terminal -->
    <main class="dex-container">
        <div class="os-window">
            
            <div class="os-titlebar">
                <div class="os-dots">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="os-title">disk_os@root:~/compilador_b2b</div>
            </div>

            <div class="os-content">
                <div class="terminal-intro">
                    <p>Last login: <span id="timeNode"></span> on console</p>
                    <p>Disk Creativo OS (v1.0.4) - Enterprise Qualifier Module</p>
                    <p class="sys-success">System ready. Please provide architectural parameters.</p>
                </div>

                <form id="auditForm" class="audit-form">
                    
                    <!-- Bloque 1: Identidad Comercial -->
                    <div class="form-block">
                        <span class="block-header">Identidad Comercial</span>
                        
                        <div class="form-group">
                            <label class="form-label" for="q_nombre"><span class="prompt-symbol">~ $</span> Nombre del Negocio / Marca:</label>
                            <input type="text" id="q_nombre" class="terminal-input" placeholder="Ingresa el nombre aquí" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="q_sector"><span class="prompt-symbol">~ $</span> Sector o Tipo de Negocio:</label>
                            <select id="q_sector" class="terminal-input" required>
                                <option value="" disabled selected>Selecciona un sector</option>
                                <option value="Tattoo & Body Art">Tattoo / Arte Corporal</option>
                                <option value="Automotriz">Automotriz (Ventas, Detailing, Taller)</option>
                                <option value="Gastronomía">Gastronomía / Restaurantes</option>
                                <option value="Servicios Profesionales">Servicios Profesionales / Consultoría</option>
                                <option value="Retail & Moda">Retail / Moda / Tienda Física</option>
                                <option value="Bienes Raíces">Real Estate / Bienes Raíces</option>
                                <option value="Tecnología & SaaS">Tech / Startups / Software</option>
                                <option value="Otro">Otro Sector</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="q_modelo"><span class="prompt-symbol">~ $</span> Modelo de Ingresos Principal:</label>
                            <select id="q_modelo" class="terminal-input" required>
                                <option value="" disabled selected>Selecciona el modelo de negocio</option>
                                <option value="B2B (Business to Business)">B2B (Venta a otras empresas)</option>
                                <option value="B2C (Venta Directa al Consumidor)">B2C (Venta directa al cliente final)</option>
                                <option value="Suscripción / Membresías">Suscripciones / Membresías recurrentes</option>
                                <option value="E-commerce Puro">E-commerce / Venta 100% online</option>
                            </select>
                        </div>
                    </div>

                    <!-- Bloque 2: Diagnóstico Operativo -->
                    <div class="form-block">
                        <span class="block-header">Diagnóstico Operativo</span>
                        
                        <div class="form-group">
                            <label class="form-label" for="q_infra"><span class="prompt-symbol">~ $</span> Infraestructura Actual (Qué tienes hecho):</label>
                            <select id="q_infra" class="terminal-input" required>
                                <option value="" disabled selected>Selecciona tu estado actual</option>
                                <option value="Solo Redes Sociales">Solo existimos en Instagram / TikTok / Redes</option>
                                <option value="Web Básica Obsoleta">Tenemos una web, pero está desactualizada y no vende</option>
                                <option value="WhatsApp y Excel Puro">Operamos a pura fuerza bruta: WhatsApp, Excel y papel</option>
                                <option value="Ecosistema Parcial">Tenemos algunas herramientas, pero están desconectadas</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="q_falla"><span class="prompt-symbol">~ $</span> Cuellos de Botella (Procesos Ineficientes):</label>
                            <select id="q_falla" class="terminal-input" required>
                                <option value="" disabled selected>Identifica el mayor problema actual</option>
                                <option value="Pérdida de ventas por lentitud">Se pierden clientes por responder lento en WhatsApp / DM</option>
                                <option value="Caos de Agendamiento">El control de citas o reservas es un dolor de cabeza manual</option>
                                <option value="Cobros manuales">Los cobros no están automatizados, dependo de capturas de Yappy/Transferencia</option>
                                <option value="Baja Percepción de Marca">El cliente no nos percibe "Premium", falta autoridad visual</option>
                                <option value="Operación Fragmentada">Uso 5 plataformas distintas para vender un solo producto</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="q_detonante"><span class="prompt-symbol">~ $</span> Detonante del Cambio (Por qué buscar una solución HOY):</label>
                            <textarea id="q_detonante" class="terminal-input" placeholder="Ej: Me cansé de perder ventas en la madrugada, necesito automatizar..." required></textarea>
                        </div>
                    </div>

                    <!-- Bloque 3: Alcance y Visión -->
                    <div class="form-block">
                        <span class="block-header">Alcance y Visión</span>
                        
                        <div class="form-group">
                            <label class="form-label" for="q_objetivo"><span class="prompt-symbol">~ $</span> Requerimiento Objetivo (Qué buscas construir):</label>
                            <select id="q_objetivo" class="terminal-input" required>
                                <option value="" disabled selected>Selecciona el módulo de software</option>
                                <option value="Landing Page Transaccional">Landing Page Orientada a Ventas / Captura de Leads</option>
                                <option value="E-commerce Integral">Tienda Online / E-commerce Completo</option>
                                <option value="Software a Medida / SaaS">Plataforma Custom / Panel Administrativo a medida</option>
                                <option value="Rebranding + Infraestructura Web">Reestructuración total: Identidad Visual + Sitio Web</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="q_vision"><span class="prompt-symbol">~ $</span> Visión a 12-24 meses:</label>
                            <textarea id="q_vision" class="terminal-input" placeholder="¿Dónde ves a la empresa con esta nueva infraestructura?" required></textarea>
                        </div>
                    </div>

                    <!-- Bloque 4: Asignación de Capital -->
                    <div class="form-block">
                        <span class="block-header">Asignación de Capital</span>
                        
                        <div class="form-group">
                            <label class="form-label" for="q_presupuesto"><span class="prompt-symbol">~ $</span> Rango de Presupuesto Asignado (Ajuste Panamá):</label>
                            <select id="q_presupuesto" class="terminal-input" required>
                                <option value="" disabled selected>Selecciona el capital disponible para el despliegue</option>
                                <option value="$300 - $600 USD (MVP)">$300 - $600 USD (Despliegue Rápido / Landing Page Básica)</option>
                                <option value="$600 - $1,200 USD (Estándar)">$600 - $1,200 USD (Ecosistema Estándar / Landing Pro o E-commerce Básico)</option>
                                <option value="$1,200 - $2,500 USD (Avanzado)">$1,200 - $2,500 USD (Infraestructura Comercial B2B Completa + Automatización)</option>
                                <option value="$2,500 - $5,000 USD (SaaS)">$2,500 - $5,000 USD (Software Custom / Plataforma a Medida)</option>
                                <option value="$5,000+ USD (Enterprise)">$5,000+ USD (Proyecto Enterprise / Integraciones Complejas)</option>
                            </select>
                        </div>
                    </div>

                    <div class="terminal-submit-wrapper">
                        <button type="submit" class="btn-execute">Ejecutar Compilación</button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- Scripts Modulares -->
    <script src="assets/js/main.js?v=13"></script>
    <script src="assets/js/terminal.js?v=13"></script>
</body>
</html>
