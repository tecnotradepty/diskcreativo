<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disk Creativo | Inicia tu Proyecto</title>
    <meta name="description" content="Inicia tu proyecto con Disk Creativo. Cuéntanos tu idea o necesidad operativa y conversemos directamente.">
    <meta name="theme-color" content="#050505">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/brand/logo-nav.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Estilos Modulares -->
    <link rel="stylesheet" href="assets/css/main.css?v=27">
    <link rel="stylesheet" href="assets/css/terminal.css?v=27">
</head>
<body>

    <!-- Fondo: Negro profundo con puntitos blancos apenas perceptibles -->
    <div class="space-dots-bg" aria-hidden="true">
        <div class="space-dot-layer layer-a"></div>
        <div class="space-dot-layer layer-b"></div>
    </div>

    <!-- ─── NAVBAR ─── -->
    <nav class="top-navbar nav-claymorphic is-at-top" id="topNavbar">
        <div class="navbar-inner-wrapper">
            <a href="index.html" class="navbar-brand">
                <img src="assets/images/brand/logo-nav.png" alt="Disk Icon" class="brand-icon">
                <span class="brand-name">DISK<br>CREATIVO</span>
            </a>

            <a href="index.html" class="nav-link nav-link-inicio">
                <span>Inicio</span>
            </a>

            <a href="dex.html" class="nav-link nav-link-multiline active">
                <span>Inicia tu<br>Proyecto</span>
            </a>

            <a href="https://wa.me/50768529324" target="_blank" rel="noopener noreferrer" class="nav-btn-clay">
                <span>CONTACTO</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
        </div>
    </nav>

    <!-- ─── VENTANA MACOS BLANCA MINIMALISTA ─── -->
    <main class="dex-container">
        
        <div class="macos-window">
            
            <!-- Barra de título macOS limpia -->
            <header class="macos-titlebar">
                <div class="macos-traffic-lights" aria-hidden="true">
                    <span class="traffic-light close"></span>
                    <span class="traffic-light minimize"></span>
                    <span class="traffic-light expand"></span>
                </div>
                <span class="macos-title">Nuevo Proyecto</span>
            </header>

            <!-- Cuerpo del formulario -->
            <div class="macos-content">
                
                <div class="macos-intro">
                    <h1>Inicia tu proyecto</h1>
                    <p>Cuéntanos qué necesitas construir o resolver en tu negocio.</p>
                </div>

                <form id="auditForm" class="macos-form">
                    
                    <!-- 1. Qué necesita -->
                    <div class="field-block">
                        <label class="field-label">¿Qué buscas desarrollar?</label>
                        <input type="hidden" id="q_solucion" value="Sitio Web / Landing Page">
                        <div class="segmented-group" data-target="q_solucion">
                            <button type="button" class="seg-btn active" data-value="Sitio Web / Landing Page">Web / Landing</button>
                            <button type="button" class="seg-btn" data-value="E-Commerce / Tienda Online">E-Commerce</button>
                            <button type="button" class="seg-btn" data-value="Software a Medida / Sistema">Software a Medida</button>
                            <button type="button" class="seg-btn" data-value="Automatización">Automatización</button>
                        </div>
                    </div>

                    <!-- 2. Nombre / Empresa -->
                    <div class="field-block">
                        <label class="field-label" for="q_nombre">Nombre o empresa</label>
                        <input type="text" id="q_nombre" class="macos-input" placeholder="Tu nombre o el de tu negocio" required>
                    </div>

                    <!-- 3. Profundización libre -->
                    <div class="field-block">
                        <label class="field-label" for="q_detalles">Sobre el proyecto</label>
                        <textarea id="q_detalles" class="macos-textarea" rows="4" placeholder="Describe tu idea, cómo funciona tu negocio hoy o qué problema específico necesitas resolver..." required></textarea>
                    </div>

                    <!-- 4. Presupuesto -->
                    <div class="field-block">
                        <label class="field-label">Presupuesto estimado (USD)</label>
                        <input type="hidden" id="q_presupuesto" value="$600 – $1,200">
                        <div class="segmented-group" data-target="q_presupuesto">
                            <button type="button" class="seg-btn" data-value="$300 – $600">$300 – $600</button>
                            <button type="button" class="seg-btn active" data-value="$600 – $1,200">$600 – $1,200</button>
                            <button type="button" class="seg-btn" data-value="$1,200 – $2,500">$1,200 – $2,500</button>
                            <button type="button" class="seg-btn" data-value="$2,500+">$2,500+</button>
                            <button type="button" class="seg-btn" data-value="Por definir">Por definir</button>
                        </div>
                    </div>

                    <!-- Acción final -->
                    <div class="macos-footer">
                        <button type="submit" class="macos-submit-btn">
                            <span>Continuar en WhatsApp</span>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <!-- Scripts Modulares -->
    <script src="assets/js/main.js?v=27"></script>
    <script src="assets/js/terminal.js?v=27"></script>
</body>
</html>
